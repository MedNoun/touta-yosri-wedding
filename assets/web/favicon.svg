<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Des lanternes de papier dans la nuit">
  <title>Eya &amp; Yosri</title>
  <!-- La marque du site : la nuit des lanternes, en un carré.
       Redessinée à partir du <symbol id="lantern-body"> de index.html,
       mais épaissie et simplifiée : à 16 px seules la silhouette et la
       lueur survivent, alors elles portent tout le dessin. Une lanterne
       est haute et étroite : c'est le halo, large, qui remplit le
       carré — pas des lanternes de remplissage, qui viraient au gris. -->
  <defs>
    <radialGradient id="f-night" cx="50%" cy="44%" r="74%">
      <stop offset="0%" stop-color="#36271D" />
      <stop offset="100%" stop-color="#140E09" />
    </radialGradient>
    <radialGradient id="f-halo" cx="50%" cy="55%" r="62%">
      <stop offset="0%" stop-color="#FFD599" stop-opacity=".5" />
      <stop offset="30%" stop-color="#F5AC61" stop-opacity=".25" />
      <stop offset="62%" stop-color="#E08C42" stop-opacity=".09" />
      <stop offset="100%" stop-color="#D2762E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="f-paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B05816" />
      <stop offset="17%" stop-color="#EE9B45" />
      <stop offset="46%" stop-color="#FFD79A" />
      <stop offset="73%" stop-color="#F0A052" />
      <stop offset="100%" stop-color="#AE5615" />
    </linearGradient>
    <radialGradient id="f-glow" cx="50%" cy="60%" r="58%">
      <stop offset="0%" stop-color="#FFF7E2" stop-opacity=".95" />
      <stop offset="55%" stop-color="#FFCE86" stop-opacity=".38" />
      <stop offset="100%" stop-color="#F0A052" stop-opacity="0" />
    </radialGradient>

    <!-- Le gabarit, dessiné une fois : la grande lanterne et les deux
         lointaines n'en sont que des copies à d'autres échelles. -->
    <g id="f-lantern">
      <path d="M30 5C35 5 39 7 40.5 10L52 20 56 33 52 53 46.5 64H13.5L8 53 4 33 8 20 19.5 10C21 7 25 5 30 5Z"
        fill="url(#f-paper)" />
      <path d="M30 5C35 5 39 7 40.5 10L52 20 56 33 52 53 46.5 64H13.5L8 53 4 33 8 20 19.5 10C21 7 25 5 30 5Z"
        fill="url(#f-glow)" />
      <g stroke="#8E4413" stroke-width="1.5" opacity=".34" fill="none">
        <path d="M30 6V64" />
        <path d="M20.5 9.4 13.5 64" />
        <path d="M39.5 9.4 46.5 64" />
      </g>
      <path d="M19.5 10C23 8 37 8 40.5 10" fill="none" stroke="#7C3B10" stroke-width="2.6" stroke-linecap="round" />
      <path d="M13.5 64H46.5" fill="none" stroke="#8A4413" stroke-width="2.2" stroke-linecap="round" />
      <ellipse cx="30" cy="64" rx="16.5" ry="3.2" fill="#5E2A0A" opacity=".3" />
      <ellipse cx="30" cy="57.5" rx="4.6" ry="6.8" fill="#FFF1CC" opacity=".8" />
      <ellipse cx="30" cy="58.4" rx="2.3" ry="3.9" fill="#FFFEF6" />
      <path d="M17.5 65 30 71 42.5 65" fill="none" stroke="#8A4413" stroke-width="1.8"
        opacity=".6" stroke-linecap="round" />
    </g>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#f-night)" />

  <!-- quelques étoiles, très basses : à 16 px elles se fondent dans la nuit -->
  <g fill="#FFE9C8">
    <circle cx="13" cy="13" r=".9" opacity=".55" />
    <circle cx="52" cy="17" r=".75" opacity=".4" />
    <circle cx="47" cy="8" r=".6" opacity=".3" />
    <circle cx="9"  cy="30" r=".6" opacity=".28" />
  </g>

  <!-- le halo, à pleine surface : c'est lui qui remplit le carré -->
  <rect width="64" height="64" rx="13" fill="url(#f-halo)" />

  <!-- la grande : centrée sur sa panse, pas sur le dessin entier -->
  <g transform="translate(32 33) scale(.76) translate(-30 -37)"><use href="#f-lantern" /></g>
</svg>
